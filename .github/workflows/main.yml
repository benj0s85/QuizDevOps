name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances du backend
        working-directory: ./backend
        run: npm install

      - name: Run unit test
        working-directory: ./backend
        run: npm test

  CD:
    name: CD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Login to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USER}" --password-stdin
        
      - name: Build and push Docker image (Backend)
        working-directory: ./backend
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/my-app:${GITHUB_SHA} .
          docker push ${{ secrets.DOCKER_USER }}/my-app:${GITHUB_SHA}
          docker tag ${{ secrets.DOCKER_USER }}/my-app:${GITHUB_SHA} ${{ secrets.DOCKER_USER }}/my-app:latest
          docker push ${{ secrets.DOCKER_USER }}/my-app:latest
